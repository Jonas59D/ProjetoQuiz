<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>QUIZ TI</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div id="quiz-container">
      <h1>Quiz de Tecnologia</h1>

      <!-- Tela de início -->
      <div id="inicio">
        <p>Digite seu nome para começar:</p>
        <input type="text" id="nome" placeholder="Seu nome" />
        <button id="btn-iniciar">Iniciar Quiz</button>
      </div>

      <!-- Tela de perguntas -->
      <div id="quiz" class="hidden">
        <h2 id="pergunta"></h2>
        <div id="opcoes"></div>
        <button id="btn-proximo" class="hidden">Próxima</button>
      </div>

      <!-- Tela de resultado -->
      <div id="resultado" class="hidden">
        <h2>Resultado Final</h2>
        <p id="mensagem"></p>
        <p id="acertos"></p>
        <p id="erros"></p>
        <p id="percentual"></p>
        <canvas id="grafico" width="300" height="300"></canvas>
        <button id="btn-reiniciar">Refazer Quiz</button>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="scripts.js"></script>
  </body>
</html>
